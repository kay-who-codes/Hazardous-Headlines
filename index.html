<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hazardous Headlines</title>
<style>
:root{
  --bg:#121214; --panel:#1c1c20; --panel2:#232328; --text:#eee; --muted:#9a9aa2;
  --accent:#ff5a5f; --accent2:#ffb84d;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; align-items:center;
}
.wrap{width:100%; max-width:480px; padding:16px; padding-bottom:40px;}
h1{font-size:1.4rem; text-align:center; margin:4px 0 0;}
.sub{text-align:center; color:var(--muted); font-size:0.82rem; margin-bottom:16px;}
.card-panel{background:var(--panel); border-radius:14px; padding:16px; margin-bottom:14px; border:1px solid #2a2a30;}
.btn{
  background:var(--accent); color:#fff; border:none; border-radius:10px; padding:13px 16px;
  font-size:1rem; font-weight:600; width:100%; margin-top:8px; cursor:pointer;
}
.btn.secondary{background:var(--panel2); color:var(--text); border:1px solid #333;}
.btn:disabled{opacity:0.35;}
label{font-size:0.8rem; color:var(--muted); display:block; margin:0 0 6px;}
.hand{display:flex; flex-direction:column; gap:8px; margin:10px 0;}
.hcard{
  background:var(--panel2); border:2px solid #333; border-radius:10px; padding:12px 14px;
  display:flex; justify-content:space-between; align-items:center; user-select:none; cursor:pointer;
}
.hcard.exclusive{border-color:var(--accent2); background:#2a230f;}
.hcard.selected{border-color:var(--accent); background:#2a1c1e;}
.hcard .txt{font-size:1rem;}
.hcard .pts{color:var(--accent2); font-weight:700; font-size:0.9rem; margin-left:10px; white-space:nowrap;}
.counter{text-align:center; color:var(--muted); font-size:0.8rem; margin-top:4px;}
.note{background:#1a1a1e; border-left:3px solid var(--accent2); padding:10px 12px; border-radius:6px; font-size:0.82rem; color:var(--muted); margin-top:10px;}
.flexrow{display:flex; gap:8px;}
.flexrow .btn{flex:1;}
/* fullscreen headline overlay */
.overlay{
  position:fixed; inset:0; background:var(--bg); z-index:50;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px; text-align:center; gap:14px;
}
.overlay.hidden{display:none;}
.overlay .word{font-size:2rem; font-weight:800; line-height:1.3;}
.overlay .close{
  position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:16px;
  background:var(--panel2); border:1px solid #333; color:var(--text);
  width:44px; height:44px; border-radius:50%; font-size:1.2rem; cursor:pointer;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Hazardous Headlines</h1>
  <div class="sub">Your private hand — everyone else has their own device</div>

  <div class="card-panel">
    <label style="margin-bottom:2px;">Select up to 3 cards</label>
    <div class="hand" id="handDiv"></div>
    <div class="counter" id="selCounter"></div>
    <div class="flexrow">
      <button class="btn" id="showBtn" onclick="showFullscreen()">Display Headline</button>
      <button class="btn secondary" id="swapBtn" onclick="swapSelected()">Swap Selected</button>
    </div>
    <button class="btn secondary" onclick="newHand()">New Hand (5 fresh cards)</button>
    <div class="note" id="swapNote">You can swap up to 3 cards once per hand. Select the cards to replace, then tap Swap.</div>
  </div>
</div>

<div class="overlay hidden" id="fullscreen">
  <button class="close" onclick="closeFullscreen()">✕</button>
  <div id="fullscreenText"></div>
</div>

<script>
const WORD_BANK = [
  // Subjects / Who
  ["Local Man",8],["Blind Dog",10],["Mayor",6],["The President",12],["A Toddler",9],
  ["Your Ex",11],["Scientists",7],["A Raccoon",14],["Grandma",9],["The Pope",15],
  ["A Robot",13],["The IRS",10],["A Squirrel",12],["The Weather Channel",8],
  ["Local Woman",8],["The Vice President",11],["A Nun",10],["Your Landlord",11],
  ["A Substitute Teacher",10],["The Neighborhood Cat",9],["A Traveling Salesman",11],
  ["Your Uncle",8],["The Local Sheriff",9],["A Retired Astronaut",13],
  ["The School Board",8],["A Group of Nudists",14],["The Boy Scouts",7],
  ["A Psychic",9],["The Class President Class of '99",13],["Your Dentist",8],
  ["A Cult Leader",13],["The National Guard",9],["A Furry Convention",12],
  ["Local Teens",7],["The Homeowners Association",10],["A Disgraced Senator",12],
  ["Your Roommate",8],["The Ice Cream Man",9],["A Flat Earther",11],
  ["The Kardashians",10],["A Sleep-Deprived Barista",10],["Your Therapist",9],
  ["The Local Librarian",7],["A Confused Tourist",9],["The Tooth Fairy",10],
  ["A Rogue AI",14],["The Illuminati",13],["A Retired Wrestler",11],
  ["The Mail Carrier",7],["A Suburban Dad",8],["The Prom Queen",8],
  ["A Bigfoot Hunter",11],["The Local Militia",11],["A Time Traveler",13],
  ["The Easter Bunny",10],["A Disbarred Lawyer",11],["The Coast Guard",9],
  ["A Talking Parrot",12],["The Local Gym",6],["A Conspiracy Theorist",11],
  ["The Zoo Director",8],["A Runaway Bride",12],["The PTA",7],
  ["A Notorious Hacker",13],["The Local Priest",9],["A Karen",9],
  ["The Entire Cheer Squad",10],["A Vegan Bodybuilder",10],
  // Verbs / Actions
  ["Weeps for",7],["Bites",9],["Steals",8],["Elopes with",13],["Sues",10],
  ["Confesses to",11],["Adopts",6],["Arrested for",12],["Runs for",9],
  ["Falls in Love with",14],["Declares War on",15],["Accidentally Becomes",13],
  ["Marries",10],["Kidnaps",13],["Impersonates",12],["Divorces",9],
  ["Challenges",8],["Publicly Endorses",9],["Secretly Films",11],
  ["Accidentally Adopts",11],["Files a Restraining Order Against",13],
  ["Legally Changes Name to",14],["Live-Streams",9],["Auctions Off",10],
  ["Trains",7],["Interrogates",11],["Haunts",9],["Vandalizes",10],
  ["Blackmails",12],["Photobombs",8],["Serenades",9],["Deep-Fries",8],
  ["Un-Retires to Fight",13],["Founds a Religion Around",14],["Forgives",6],
  ["Frames",9],["Ghosts",7],["Rescues",7],["Chases",7],["Worships",9],
  ["Body-Slams",12],["Recruits",8],["Fires",6],["Poisons",10],
  ["Betrays",9],["Overthrows",12],["Resurrects",13],["Clones",11],
  ["Sabotages",11],["Eats",5],["Insures",8],["Un-Invites",7],
  // Objects / Targets
  ["A Casserole",8],["The Moon",10],["A Parking Meter",12],["Bigfoot",13],
  ["A Vending Machine",11],["The Internet",9],["A Flock of Geese",14],
  ["Their Own Shadow",10],["A Time Machine",12],["The Eiffel Tower",11],
  ["A Garden Gnome",9],["The DMV Line",8],["A Haunted Mirror",12],
  ["The School Mascot",8],["A Wheel of Cheese",10],["The Office Printer",7],
  ["A Sentient Toaster",13],["The Loch Ness Monster",13],["A Drone",9],
  ["The Class Hamster",8],["A Pile of Tax Documents",9],["The Self-Checkout",8],
  ["A Herd of Alpacas",12],["The Great Barrier Reef",11],["A Karaoke Machine",9],
  ["The Titanic Wreckage",12],["A Suspiciously Large Turkey",11],
  ["The Interstate",9],["A Piñata",8],["The County Fair",7],
  ["A Cursed Amulet",12],["The Grocery Store",6],["A Rubber Duck",7],
  ["The Local Landfill",8],["A Stack of Pancakes",9],["The Ozone Layer",10],
  ["A Malfunctioning ATM",10],["The Space Station",12],["A Bounce House",8],
  // Places / Time / Tags
  ["Mayor's Office",7],["Local Diner",6],["Downtown",5],["City Hall",6],
  ["at Midnight",5],["During Rush Hour",7],["on Live TV",9],["at the DMV",8],
  ["in Florida",7],["at a Wedding",8],["Again",4],["for the Third Time",9],
  ["and Nobody Is Surprised",10],["and Wins",8],["Twitter Explodes",9],
  ["at the Grocery Store",6],["During the Super Bowl",9],["in a Costco",7],
  ["at Church",6],["on the Subway",7],["at the County Fair",7],
  ["During a Solar Eclipse",10],["at the Laundromat",6],["in a Walmart Parking Lot",8],
  ["at 3 A.M.",6],["During Finals Week",8],["at the DMV Again",9],
  ["Live on the Radio",8],["at a Gas Station",7],["During a Thunderstorm",9],
  ["at a Little League Game",8],["in the Cereal Aisle",7],["at Burning Man",10],
  ["and Refuses to Apologize",10],["and It's Caught on Camera",11],
  ["and the Internet Can't Stop Laughing",13],["Before Breakfast",7],
  ["and Demands a Recount",9],["While Wearing a Onesie",10],
  ["and Blames Mercury Retrograde",11],["for Charity",7],
  ["and It Somehow Works",9],["and Local News Shows Up",10],
  ["Out of Spite",8],["by Accident",6],["on a Dare",7],["for the Likes",8]
];
const EXCLUSIVE_LABEL = "⭐ EXCLUSIVE (doubles your hand)";

function freshDeck(){
  let deck = [];
  WORD_BANK.forEach(([txt,pts])=>{
    deck.push({text:txt, points:pts, exclusive:false});
    deck.push({text:txt, points:pts, exclusive:false});
  });
  for(let i=0;i<3;i++) deck.push({text:EXCLUSIVE_LABEL, points:0, exclusive:true});
  return shuffle(deck);
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

let deck = [];
let hand = [];
let selected = []; // ordered indices, max 3
let swapUsedThisHand = false;

function draw(){
  if(deck.length===0) deck = freshDeck();
  return deck.pop();
}

function init(){
  deck = freshDeck();
  hand = [];
  for(let i=0;i<5;i++) hand.push(draw());
  selected = [];
  swapUsedThisHand = false;
  renderHand();
}

function renderHand(){
  const div = document.getElementById('handDiv');
  div.innerHTML = '';
  hand.forEach((card, idx)=>{
    const selPos = selected.indexOf(idx);
    const el = document.createElement('div');
    el.className = 'hcard' + (card.exclusive?' exclusive':'') + (selPos>-1?' selected':'');
    el.innerHTML = `<span class="txt">${card.text}${selPos>-1?' <b>#'+(selPos+1)+'</b>':''}</span><span class="pts">${card.exclusive?'★':card.points+' pts'}</span>`;
    el.onclick = ()=>{
      const pos = selected.indexOf(idx);
      if(pos>-1){ selected.splice(pos,1); }
      else if(selected.length<3){ selected.push(idx); }
      renderHand();
    };
    div.appendChild(el);
  });
  document.getElementById('selCounter').textContent = `${selected.length}/3 selected`;
  document.getElementById('showBtn').disabled = selected.length!==3;
  document.getElementById('swapBtn').disabled = selected.length===0 || swapUsedThisHand;
  document.getElementById('swapNote').textContent = swapUsedThisHand
    ? "Swap already used this hand. Draw a new hand to swap again."
    : "You can swap up to 3 cards once per hand. Select the cards to replace, then tap Swap.";
}

function swapSelected(){
  if(swapUsedThisHand || selected.length===0) return;
  const toSwap = selected.slice().sort((a,b)=>b-a);
  toSwap.forEach(idx=>{ hand.splice(idx,1); });
  const need = 5-hand.length;
  for(let i=0;i<need;i++) hand.push(draw());
  selected = [];
  swapUsedThisHand = true;
  renderHand();
}

function newHand(){
  hand = [];
  for(let i=0;i<5;i++) hand.push(draw());
  selected = [];
  swapUsedThisHand = false;
  renderHand();
}

function showFullscreen(){
  if(selected.length!==3) return;
  const text = selected.map(idx=>hand[idx].text).join(' ');
  document.getElementById('fullscreenText').innerHTML = `<div class="word">${text}</div>`;
  document.getElementById('fullscreen').classList.remove('hidden');
}
function closeFullscreen(){
  document.getElementById('fullscreen').classList.add('hidden');
}

init();
</script>
</body>
</html>
